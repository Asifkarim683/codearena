# Import environment variables from .env file
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Application
spring.application.name=codearena
server.port=8090

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/codearena
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:asif2003}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:codearena_super_secret_key_2024_must_be_at_least_256_bits_long}
jwt.expiration=86400000
jwt.refresh-expiration=604800000
spring.main.allow-circular-references=true